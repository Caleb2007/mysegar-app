name: mysegar
description: MySegar Flutter app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  image: ^4.5.4
  lottie: ^3.3.3
  tflite_flutter: ^0.11.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/
    - assets/model/labels.txt
    - assets/images/
    - assets/animations/tree_growth.lottie
    - assets/animations/tree_growth.json
